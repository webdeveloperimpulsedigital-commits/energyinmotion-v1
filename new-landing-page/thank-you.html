<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You | Energy In Motion</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body {
    background: #01262D;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    margin: 0;
  }
  .thank-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(40px, 6vw, 80px) 20px;
  }
  .thank-card {
    background: #ffffff;
    color: #01262D;
    border-radius: 20px;
    padding: clamp(32px, 4vw, 56px);
    max-width: 560px;
    width: 100%;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0, 10, 13, 0.6);
    position: relative;
    overflow: hidden;
  }
  .thank-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: #38E0CF;
  }
  .thank-icon {
    width: 60px;
    height: 60px;
    background: #38E0CF;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #01262D;
    font-weight: 700;
    margin: 0 auto 24px;
  }
  .thank-title {
    font-size: clamp(24px, 3vw, 34px);
    font-weight: 600;
    line-height: 1.15;
    margin: 0 0 16px;
    letter-spacing: -0.03em;
  }
  .thank-desc {
    font-size: 16px;
    line-height: 1.6;
    color: #4A6B70;
    margin: 0 0 32px;
  }
  .btn-back {
    display: inline-block;
    background: #01262D;
    color: #ffffff;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 8px;
    text-decoration: none;
    transition: background 0.25s, color 0.25s;
  }
  .btn-back:hover {
    background: #38E0CF;
    color: #01262D;
  }
</style>
</head>
<body>
<header class="eim-header">
  <div class="eim-header-inner">
    <div class="eim-header-left">
      <a href="index.html" class="eim-header-logo-link">
        <img src="../images/logo-eim.svg" alt="Energy In Motion" class="eim-header-logo">
      </a>
    </div>
    <a href="index.html" class="eim-header-cta">Back to Home</a>
  </div>
</header>

<main class="thank-wrap">
  <div class="thank-card">
    <div class="thank-icon">&#10003;</div>
    <h1 class="thank-title">Thank you. We&rsquo;ve received your requirement.</h1>
    <p class="thank-desc">The Energy In Motion team will review the details you shared and get in touch to understand your fleet, route and operating requirements better.</p>
    <a href="index.html" class="btn-back">Back to Landing Page &rarr;</a>
  </div>
</main>

<footer class="eim-footer" style="padding-top: 30px; padding-bottom: 30px;">
  <div class="eim-footer-container" style="text-align: center;">
    <div class="eim-footer-bottom">&copy; 2026 Energy In Motion Limited. All rights reserved.</div>
  </div>
</footer>
</body>
</html>
